spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cce_collector}
    username: ${DB_USER:cce_collector}
    password: ${DB_PASSWORD:cce_collector}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9094}

cce:
  collector:
    fhir-validation:
      enabled: true
      strict-mode: false
    dedup:
      lookback-days: 30

logging:
  level:
    org.openphc.cce.collector: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
